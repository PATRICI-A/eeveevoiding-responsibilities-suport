spring.application.name=m10-bienestar-soporte
server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bienestar_db
spring.datasource.username=patricia
spring.datasource.password=patricia123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:mi-clave-secreta-provisional-minimo-32-chars}

# Logging
logging.level.root=WARN
logging.level.edu.eci.patricia=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=trueui.try-it-out-enabled=true