name: CD – Deploy to QA

on:
  push:
    branches:
      - main

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: patrici-a/eeveevoiding-responsibilities-suport
  RESOURCE_GROUP: rg-patricia-prod

jobs:

  build-and-push:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests -B

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:qa-latest

  deploy-qa:
    name: "Deploy to QA"
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to QA Container App
        run: |
          az containerapp update \
            --name patricia-suport-service-qa \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:qa-latest \
            --set-env-vars \
              SPRING_PROFILES_ACTIVE=qa \
              SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }} \
              SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }} \
              SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }} \
              JWT_SECRET=${{ secrets.JWT_SECRET }} \
              PORT=8080

      - name: Health check QA
        run: |
          echo "Waiting 60s for container to stabilize..."
          sleep 60
          QA_URL=$(az containerapp show \
            --name patricia-suport-service-qa \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "QA URL: https://$QA_URL"
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://$QA_URL/actuator/health)
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then 
              echo "Health check passed!"
              exit 0
            fi
            sleep 20
          done
          
          echo "Health check failed. Fetching logs..."
          az containerapp logs show \
            --name patricia-suport-service-qa \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --tail 100
          
          exit 1
