services:
  mongo:
    image: mongo:7
    container_name: mongo-bienestar
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: m10-bienestar
    ports:
      - "8081:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/bienestar
    depends_on:
      - mongo

volumes:
  mongo-data: