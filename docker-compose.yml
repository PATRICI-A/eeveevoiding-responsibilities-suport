# ================================================================
# docker-compose.yml — desarrollo local
# Levanta PostgreSQL y el microservicio con perfil local.
#
# Uso:
#   docker compose up --build       → levanta todo
#   docker compose up postgres      → solo la DB (correr app desde IDE)
#   docker compose down -v          → baja todo y borra volúmenes
# ================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: suport-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_suport
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_suport"]
      interval: 10s
      timeout: 5s
      retries: 5

  suport-service:
    build: .
    container_name: suport-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      # PostgreSQL — apunta al contenedor de arriba (nombre del servicio = host)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_suport
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # JWT — valor de prueba solo para local
      JWT_SECRET: local-dev-secret-not-for-production-at-all
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
