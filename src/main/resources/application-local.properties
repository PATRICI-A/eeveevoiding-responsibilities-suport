# ================================================================
# application-local.properties — desarrollo local
# Activar con: SPRING_PROFILES_ACTIVE=local
# NUNCA commitear credenciales reales aquí.
# Este archivo SÍ va al repo (solo tiene valores de dev).
# ================================================================

# --- PostgreSQL local (contenedor Docker) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/db_suport
spring.datasource.username=postgres
spring.datasource.password=postgres

# --- JPA: create-drop mientras no hay migraciones Flyway ---
spring.jpa.hibernate.ddl-auto=create-drop

# --- Pool más generoso en local ---
spring.datasource.hikari.maximum-pool-size=10

# --- Ver SQL en consola durante desarrollo ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT local (valor de prueba, nunca el de producción) ---
jwt.secret=local-dev-secret-not-for-production-at-all-minimum-32

# --- Swagger habilitado en local ---
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# --- Logs más verbosos en local ---
logging.level.root=INFO
logging.level.com.suport=DEBUG
