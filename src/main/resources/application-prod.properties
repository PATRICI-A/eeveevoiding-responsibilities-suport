# ================================================================
# application-prod.properties — producción (Azure)
# Las variables de entorno las inyecta el Container App de Azure.
# ================================================================

# --- PostgreSQL prod (Azure Flexible Server) ---
# URL: jdbc:postgresql://psql-patricia-hangout-prod.postgres.database.azure.com:5432/db_suport?sslmode=require
spring.datasource.hikari.maximum-pool-size=5

# --- JPA: create-drop mientras no hay migraciones Flyway ---
# Cambiar a validate cuando Flyway esté activo
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# --- Swagger desactivado en prod ---
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# --- Logs mínimos en prod ---
logging.level.root=WARN
logging.level.com.suport=INFO
